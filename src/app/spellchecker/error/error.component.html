<ng-container *ngIf="error && context && getContext(error.word)">
    <div class="error-box">
        <header class="header" (click)="toggle()">
            <div class="preview" *ngIf="showContext" [innerHTML]="getContext(error.word) | highlight:error"></div>
            <div class="preview" *ngIf="!showContext">{{ error.word }}</div>
            <div class="toggle" [class.active]="isOpen" tabindex="0" (keydown.enter)="toggle()" role="button">
                <img src="assets/icons/chevron-down.svg" alt="{lang.arrowDownIconAlt}">
            </div>
        </header>
        

        <section class="suggestions" *ngIf="isOpen">
          <!-- if more than one error -->
          <div class="witty-works-ext-container-row witty-works-ext-justify-center witty-works-ext-margin-bottom">
            <!-- if not first error -->
            <!-- on click decrement -->
            <img src="assets/icons/chevron-left.svg" alt="{lang.chevronLeftAlt}"> 
              <div class="witty-works-ext-error-counter">1/6</div>
              <!-- on click increment -->
            <img src="assets/icons/chevron-right.svg" alt="{lang.chevronRightAlt}">
          </div>  
        <div
          class="witty-works-ext-wittyworks-container witty-works-ext-container-rounded witty-works-ext-full-padding"
          [ngStyle]="containerStyle"
        >
            <div class="witty-works-ext-lato-popover-text witty-works-ext-justify-space-between witty-works-ext-wittyworks-container">
              <div class="witty-works-ext-container-row witty-works-ext-justify-start">
                <div class="witty-works-ext-explanation-icon">{{error.details.explanation.icon}}</div>
                {{error.details.explanation.text}}
                {{error.details.explanation.context ? ' (' + error.details.explanation.context + ')' : ''}}
              </div>

              <ng-container *ngIf="error.details.explanation?.url">
                <div class="witty-works-ext-container-row witty-works-ext-justify-end witty-works-ext-lato-popover-text-gray witty-works-ext-cursor-pointer"
                     (click)="onClick(error.details.explanation.url)"
                     tabindex="0"
                     (keydown.enter)="onClick(error.details.explanation.url)"
                     role="link"
                     >
                  <div class="witty-works-ext-secondary-button-red witty-works-ext-container-row witty-works-ext-margin-top">
                    {{lang.learnMore}}
                    <ng-container *ngIf="error.details.explanation.content === 'video'">
                        <img class="witty-works-ext-margin-left" src="assets/icons/video.svg" alt="{lang.videoIconAlt}">
                    </ng-container>
                    <div class="witty-works-ext-margin-left" style="pointer-events: 'none'">
                      <img src="assets/icons/arrow-right.svg" alt="{lang.arrowRightAlt}">
                    </div>
                  </div>
                </div>
              </ng-container>

            </div>
          </div>
          <div class="suggestion-title witty-works-ext-margin-top" *ngIf="suggestions.length > 0">{{lang.tryInstead}}</div>
          <ng-container *ngFor="let suggestion of suggestions.slice(0, 5)">     
            <div class="witty-works-ext-button-wrapper" [class.hovered]="suggestion.hovered">
              <!-- make sure to decrement the index on click -->
              <button 
                (click)="acceptSuggestion(suggestion)" 
                (mouseenter)="suggestion.hovered = true" 
                (mouseleave)="suggestion.hovered = false" 
                [ngStyle]="{'text-decoration': suggestion.text ? 'none' : 'line-through'}">
                  {{ suggestion.text 
                    ? (suggestion.hovered || !suggestion.context || suggestion.text.length <= 20)
                      ? suggestion.text 
                      : (suggestion.text.substring(0, 15) + '..')
                    : error.word
                  }}
              </button>
              <div class="tag" *ngIf="!suggestion.hovered">{{suggestion.context}}</div>
            </div>       
          </ng-container>
          <div (click)="ignore()" class="witty-works-ext-margin-top witty-works-ext-ignore-color-transformer">
            <span className='witty-works-ext-margin-right witty-works-ext-cursor-pointer'>
              <img class="witty-works-ext-margin-left" src="assets/icons/ignore.svg" alt="{lang.ignore}" style="margin-bottom: -2px;">
            </span>
            <span className='witty-works-ext-lato-popover-text-gray'>
              {{lang.ignore}}              
            </span>
          </div>
        </section>
    </div>
</ng-container>
