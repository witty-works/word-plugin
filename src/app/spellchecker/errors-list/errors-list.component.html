<virtual-scroller #scroll [items]="highlights" [enableUnequalChildrenSizes]="true">
  <ol>
    @for (errorItem of scroll.viewPortItems; track errorItem) {
      <li>
        <app-error [error]="errorItem" [showContext]="showContext"
          (highlightEvent)="sendHighlight(errorItem.paragraphUniqueId, errorItem.errorUniqueId)"
        (acceptSuggestionEvent)="acceptSuggestion(errorItem.paragraphUniqueId, errorItem.errorUniqueId, $event)"></app-error>
      </li>
    }
  </ol>
</virtual-scroller>
