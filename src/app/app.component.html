<div id="main-content">
  <div role="tabpanel">
    @if (selectedTab === 'spellchecker') {
      <app-spellchecker></app-spellchecker>
    }
    @if (selectedTab === 'settings') {
      <app-settings></app-settings>
    }
  </div>
</div>

<div id="tabs">
  <app-tabs [selectedTab]="selectedTab" (tabChangedEvent)="tabChanged($event)"></app-tabs>
</div>
