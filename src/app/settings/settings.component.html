<div>
    <nav aria-label="Witty Works Navigation" class="witty-works-ext-header">
        <img src="assets/icons/witty-logo.svg" alt="Icon that shows the logo of Witty Works" role="link" tabindex="0" (keydown.enter)="openWittyHomePage()" (click)="openWittyHomePage()">
        <img src="assets/icons/settings.svg" alt="Settings icon that leads to the Witty dashboard" role="link" tabindex="0" (keydown.enter)="openDashboard()" (click)="openDashboard()">
    </nav>

    <div class='witty-works-ext-separator'></div>

    <section class='witty-works-ext-wittyworks-container witty-works-ext-container-row witty-works-ext-justify-space-between'>
        <h1 class='witty-works-ext-lato-popup-title'>
            Quick Settings
        </h1>
    </section>

    <section class="toggle" aria-labelledby="toggle-description-1">
        <div class="toggler">
            <div class="check-box">
                <input type="checkbox" id="toggle-checkbox-1" [ngModel]="checkUpperAndLowerCase" (ngModelChange)="checkUpperAndLowerCaseChanged($event)">
            </div>
        </div>
        <label for="toggle-checkbox-1" id="toggle-description-1" class="description">
            Check upper & lower case
        </label>
    </section>

    <section class="toggle" aria-labelledby="toggle-description-2">
        <div class="toggler">
            <div class="check-box">
                <input type="checkbox" id="toggle-checkbox-2" [ngModel]="checkGrammarAndSpelling" (ngModelChange)="checkGrammarAndSpellingChanged($event)">
            </div>
        </div>
        <label for="toggle-checkbox-2" id="toggle-description-2" class="description">
            Check grammar & spelling
        </label>
    </section>

    <section class="toggle" aria-labelledby="toggle-description-3">
        <div class="toggler">
            <div class="check-box">
                <input type="checkbox" id="toggle-checkbox-3" [ngModel]="showContext" (ngModelChange)="showContextChanged($event)">
            </div>
        </div>
        <label for="toggle-checkbox-3" id="toggle-description-3" class="description">
            Show context
        </label>
    </section>

    <section class='witty-works-ext-left'>
        <button
        class='witty-works-ext-button witty-works-ext-primary-button-red'
        (click)="openEditor()"
        >
          Go to Witty Editor
        </button>
    </section>

    <section class='witty-works-ext-section'>
        <p class='witty-works-ext-lato-popup-text'>
          Logged into {{teamName}}
        </p>
    </section>
</div>

<section class='witty-works-ext-section' *ngIf="isDevEnv">
    <h2 class="witty-works-ext-lato-popup-title">Development Settings</h2>
    <div class='witty-works-ext-left'>
      <button class='witty-works-ext-button witty-works-ext-primary-button-red' aria-label="Log out" (click)="logout()">
        Log out
      </button>
    </div>
</section>

<footer class="witty-works-ext-lato-popup-text">
    <div class='witty-works-ext-separator'></div>
    Witty Word Plugin Version: {{ appVersion }}
</footer>
