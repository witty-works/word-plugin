<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Witty Word Add-in</title>

  <base href="/">

  <link rel="icon" type="image/x-icon" href="favicon.ico">


  <!-- For more information on Office UI Fabric, visit https://developer.microsoft.com/fabric. -->
  <link rel="stylesheet"
    href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/9.6.1/css/fabric.min.css" />
</head>

<body class="ms-font-m ms-welcome">
  <div id="ie-warn"
    style="display: none;margin: 20px;padding: 20px;background-color: #1ebbee;color: white;font-size: 16px;">
    This add-in does not work with this version of Microsoft Office. Please update to a newer version.
  </div>
  <app-root></app-root>

  <script>
    let officeInitializePromise;

    officeInitializePromise = new Promise((resolve) => {
      console.log('Loading Office.js');
      const script = document.createElement('script');
      script.src = "https://appsforoffice.microsoft.com/lib/1/hosted/office.js";
      script.onload = () => {
        Office.onReady(() => {
          window.history.replaceState = replaceState;
          window.history.pushState = pushState;          
          resolve();
        });
      };

      document.body.appendChild(script);
    });

    const replaceState = window.history.replaceState;
    const pushState = window.history.pushState;
    if (navigator.userAgent.indexOf("Trident") !== -1 || navigator.userAgent.indexOf("Edge") !== -1) {
      const ieMessage = document.getElementById("ie-warn");
      if (ieMessage) {
        ieMessage.style.display = 'block';
      }
    }

    const searchParams = new URLSearchParams(window.location.search);
    const status = searchParams.get('status');
    if (status) {
      localStorage.setItem('registerStatus', status);
      if (status === 'success') {
        localStorage.setItem('authFailCounter', '0');
      }
      window.open(
        `${environment.dashboard}word-addin?status=${status}`,
        '_self',
        'noopener'
      );
    }
  </script>
</body>

</html>
