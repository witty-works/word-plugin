<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Witty Word Add-in</title>

  <base href="/">

  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Office JavaScript API -->
  <script type="text/javascript">
    // Cache the history method values.
    window._historyCache = {
      replaceState: window.history.replaceState,
      pushState: window.history.pushState
    };
  </script>

  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <script type="text/javascript">
    // Restore the history method values after loading Office.js
    window.history.replaceState = window._historyCache.replaceState;
    window.history.pushState = window._historyCache.pushState;
  </script>

  <!-- For more information on Office UI Fabric, visit https://developer.microsoft.com/fabric. -->
  <link rel="stylesheet"
    href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/9.6.1/css/fabric.min.css" />
</head>

<body class="ms-font-m ms-welcome">
  <div id="ie-warn"
    style="display: none;margin: 20px;padding: 20px;background-color: #1ebbee;color: white;font-size: 16px; white-space: normal;">
    <img src="assets/icons/caution-sign.svg" alt="{{lang.cautionIconAlt}}" style="margin-right: 5px;">
    This add-in does not work with this version of Microsoft Office. Please update to a newer version.
  </div>

  <div id="warn-not-signed-in-word"
    style="display: none; margin: 20px; padding: 20px; background-color: #1ebbee; color: white; font-size: 16px;">
  </div>

  <div id="warn-not-supported-account"
    style="display: none; margin: 20px; padding: 20px; background-color: #1ebbee; color: white; font-size: 16px;">
    <span>
      <a href="mailto:support@witty.works"
        style="color: inherit; font-weight: bold; text-decoration: underline; margin-left: 0.25em; cursor: pointer;"
        role="link" tabindex="0" (click)=$event.preventDefault()>support@witty.works</a>
    </span>
  </div>

  <div id="issue-checking-text"
    style="display: none; margin: 20px; padding: 20px; background-color: #1ebbee; color: white; font-size: 16px;">
  </div>

  <div id="no-text-selected"
    style="display: none; margin: 20px; padding: 20px; background-color: #1ebbee; color: white; font-size: 16px;">
  </div>

  <div id="cant-identify-language"
    style="display: none; margin: 20px; padding: 20px; background-color: #1ebbee; color: white; font-size: 16px;">
  </div>

  <div id="warn-server-error"
    style="display: none; margin: 20px; padding: 20px; background-color: #1ebbee; color: white; font-size: 16px;">
  </div>

  <div id="warn-failed-ignore-error"
    style="display: none; margin: 20px; padding: 20px; background-color: #1ebbee; color: white; font-size: 16px;">
  </div>

  <app-root></app-root>
  <script>
    // Show update message for old Office versions that base on IE / Edge legacy
    if (navigator.userAgent.indexOf("Trident") !== -1 || navigator.userAgent.indexOf("Edge") !== -1) {
      const ieMessage = document.getElementById("ie-warn");
      if (ieMessage) {
        ieMessage.style.display = 'block';
      }
    }

    const searchParams = new URLSearchParams(window.location.search);
    const status = searchParams.get('status');
    if (status) {
      if (status === 'success') {
        localStorage.setItem('authFailCounter', '0')
      }
      window.open(
        `https://dashboard.witty.works/word-addin?status=${status}`,
        '_self',
        'noopener'
      );
    }
  </script>
</body>

</html>
