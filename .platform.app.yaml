name: app

type: nodejs:18

hooks:
    build: |
        set -e
        npm run build
        if [ ! -z "$SENTRY_SOURCEMAPS" ]
        then
            export CURRENT_VERSION=`grep -oPm1 "(?<=<Version>)[^<]+" src/manifest-prod.xml`
            echo $CURRENT_VERSION

            ./node_modules/.bin/sentry-cli sourcemaps inject --org witty-works-ag --project word-plugin dist/word-plugin
            ./node_modules/.bin/sentry-cli sourcemaps upload --org witty-works-ag --project word-plugin dist/word-plugin --release $CURRENT_VERSION
        fi

        rm src/manifest.xml
        rm src/environments/environment.test.ts
        rm src/environments/environment.ts

web:
    commands:
        # Run a no-op process that uses no CPU resources, since this is a static site.
        start: sleep infinity
    locations:
        # This tells Nginx to serve from the base directory
        "/":
            root: "dist/word-plugin"
            index:
                - "index.html"
            passthru: "/index.html"
        "/manifest":
            root: "src"
            passthru: "/manifest-prod.xml"
